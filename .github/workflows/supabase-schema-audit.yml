name: Supabase production schema audit

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-schema-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: klepxrustnlpzyivwxwf
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Supabase Management API access
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}" \
            -o /tmp/project.json
          jq -e '.id == env.SUPABASE_PROJECT_REF' /tmp/project.json >/dev/null

      - name: Capture production schema
        run: |
          set -euo pipefail
          mkdir -p audit

          run_sql() {
            local name="$1"
            local query="$2"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query/read-only" \
              --data-binary "$(jq -n --arg q "$query" '{query:$q}')" \
              > "audit/${name}.json"
          }

          run_sql public_columns "
            select table_schema, table_name, column_name, data_type, is_nullable, column_default
            from information_schema.columns
            where table_schema = 'public'
            order by table_name, ordinal_position;
          "

          run_sql public_indexes "
            select schemaname, tablename, indexname, indexdef
            from pg_indexes
            where schemaname = 'public'
            order by tablename, indexname;
          "

          run_sql public_rls "
            select n.nspname as schema_name, c.relname as table_name, c.relrowsecurity as rls_enabled
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r'
            order by c.relname;
          "

          run_sql public_policies "
            select schemaname, tablename, policyname, permissive, roles, cmd, qual, with_check
            from pg_policies
            where schemaname = 'public'
            order by tablename, policyname;
          "

          run_sql public_routines "
            select routine_schema, routine_name, routine_type, data_type
            from information_schema.routines
            where routine_schema = 'public'
            order by routine_name;
          "

          run_sql migration_history "
            select version, name
            from supabase_migrations.schema_migrations
            order by version;
          "

          run_sql public_tables "
            select table_name
            from information_schema.tables
            where table_schema = 'public' and table_type = 'BASE TABLE'
            order by table_name;
          "

          printf '%s\n' "=== PRODUCTION TABLES ==="
          jq -r '.[] | [.table_name] | @tsv' audit/public_tables.json
          printf '%s\n' "=== PRODUCTION MIGRATION HISTORY ==="
          cat audit/migration_history.json
          printf '%s\n' "=== PRODUCTION RLS ==="
          cat audit/public_rls.json

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-schema-audit
          path: audit/
          retention-days: 7
