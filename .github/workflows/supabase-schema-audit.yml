name: Supabase production database

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-schema-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: klepxrustnlpzyivwxwf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Repair legacy migration history
        run: |
          set -euo pipefail
          history="$(supabase migration list)"
          if grep -q "20261005" <<< "$history" || grep -q "20261006" <<< "$history"; then
            supabase migration repair 20261005 20261006 --status reverted
          else
            echo "No legacy 20261005/20261006 history entries found."
          fi

      - name: Apply production migrations
        run: supabase db push

      - name: Verify migration history
        run: supabase migration list

      - name: Lint production schema
        run: supabase db lint --linked --fail-on error

      - name: Verify production schema
        run: |
          set -euo pipefail
          supabase db query --linked "select count(*) as product_count, count(*) filter (where status = 'active') as active_product_count, count(*) filter (where track_inventory = false) as non_inventory_tracked from public.products;"
          supabase db query --linked "select table_name from information_schema.tables where table_schema = 'public' and table_name in ('orders','order_items','payments','order_status_history','shipping_updates','api_rate_limits','stripe_webhook_events') order by table_name;"
          supabase db query --linked "select table_name, bool_or(rls_enabled) as rls_enabled from (select c.relname as table_name, c.relrowsecurity as rls_enabled from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relname in ('products','categories','subcategories','subcategory_attributes','orders','order_items','payments')) s group by table_name order by table_name;"
          supabase db query --linked "select column_name, data_type from information_schema.columns where table_schema = 'public' and table_name = 'products' and column_name in ('status','track_inventory','stock_quantity','low_stock_threshold') order by column_name;"
          supabase db query --linked "select column_name from information_schema.columns where table_schema = 'public' and table_name = 'store_settings' and column_name like 'smtp_%' order by column_name;"
