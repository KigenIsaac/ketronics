name: Supabase production database

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-schema-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: klepxrustnlpzyivwxwf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize migration versions
        id: normalize
        run: |
          set -euo pipefail
          declare -A renames=(
            [20261005_production_schema_baseline.sql]=20261005000000_production_schema_baseline.sql
            [20261006_admin_authorization.sql]=20261006010000_admin_authorization.sql
            [20261006_api_rate_limits.sql]=20261006020000_api_rate_limits.sql
            [20261006_atomic_mpesa_success.sql]=20261006030000_atomic_mpesa_success.sql
            [20261006_atomic_order_creation.sql]=20261006040000_atomic_order_creation.sql
            [20261006_atomic_payment_success.sql]=20261006050000_atomic_payment_success.sql
            [20261006_commerce_rls_hardening.sql]=20261006060000_commerce_rls_hardening.sql
            [20261006_expire_stale_orders.sql]=20261006070000_expire_stale_orders.sql
            [20261006_inventory_cron.sql]=20261006080000_inventory_cron.sql
            [20261006_inventory_guest_orders.sql]=20261006090000_inventory_guest_orders.sql
            [20261006_inventory_release.sql]=20261006100000_inventory_release.sql
            [20261006_mpesa_attempt_lock.sql]=20261006110000_mpesa_attempt_lock.sql
            [20261006_order_state_machine.sql]=20261006120000_order_state_machine.sql
            [20261006_payment_idempotency.sql]=20261006130000_payment_idempotency.sql
            [20261006_remove_legacy_mpesa_transition.sql]=20261006140000_remove_legacy_mpesa_transition.sql
            [20261006_store_settings_hardening.sql]=20261006150000_store_settings_hardening.sql
            [20261006_stripe_webhook_idempotency.sql]=20261006160000_stripe_webhook_idempotency.sql
            [20261007_admin_staff_lifecycle.sql]=20261007000000_admin_staff_lifecycle.sql
          )

          changed=false
          for old in "${!renames[@]}"; do
            new="${renames[$old]}"
            if [ -f "supabase/migrations/$old" ]; then
              git mv "supabase/migrations/$old" "supabase/migrations/$new"
              changed=true
            fi
          done

          if [ "$changed" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: normalize Supabase migration versions"
            git push origin HEAD:main
            echo "renamed=true" >> "$GITHUB_OUTPUT"
          else
            echo "renamed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after migration rename
        if: steps.normalize.outputs.renamed == 'true'
        run: |
          echo "Migration filenames were normalized and pushed. The new commit will run the migration job again."
          exit 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply production migrations
        run: supabase db push

      - name: Verify migration history
        run: supabase migration list
