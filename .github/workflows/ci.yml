name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders only. Production secrets stay in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build.invalid.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Security and architecture regression checks
        run: npm run verify
      - name: Production build
        run: npm run build
      - name: Start production server
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/ketronics-next.log 2>&1 &
          echo $! >/tmp/ketronics-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ketronics-next.log
          exit 1
      - name: Production route smoke test
        run: node scripts/smoke-routes.mjs
